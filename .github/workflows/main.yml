name: Deutsch A1 Premium - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify database
        run: |
          python3 - <<'PY'
          import json

          path = "app/src/main/assets/words.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          assert len(data) == 1000, f"Expected 1000 records, got {len(data)}"
          assert len(set(x["german"] for x in data)) == 1000
          assert all(x.get("arabic") for x in data)
          assert all(x.get("example") for x in data)

          print("Database OK:", len(data), "records")
          PY

      - name: Fix Kotlin stdlib conflict
        run: |
          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          gradle --init-script kotlin-fix.gradle clean assembleDebug --stacktrace

      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-A1-Premium-Final-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7

      - name: Build completed
        run: |
          echo "======================================"
          echo " Deutsch A1 Premium APK BUILD SUCCESS "
          echo "======================================"
