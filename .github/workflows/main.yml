name: Deutsch A1 Premium - Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project from ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"

          rm -rf _extracted
          mkdir _extracted

          unzip -q "$ZIP" -d _extracted

          WORDS=$(find _extracted -type f \
            -path "*/app/src/main/assets/words.json" \
            -print -quit)

          if [ -z "$WORDS" ]; then
            echo "ERROR: words.json not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR="${WORDS%/app/src/main/assets/words.json}"

          echo "Project directory: $PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          echo "Android project extracted successfully"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify database
        run: |
          python3 -c "
          import json

          path = 'app/src/main/assets/words.json'

          with open(path, encoding='utf-8') as f:
              data = json.load(f)

          assert len(data) == 1000, f'Expected 1000 records, got {len(data)}'
          assert len(set(x['german'] for x in data)) == 1000
          assert all(x.get('arabic') for x in data)
          assert all(x.get('example') for x in data)

          print('Database OK:', len(data), 'records')
          "

      - name: Fix Kotlin stdlib conflict
        run: |
          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

      - name: Fix MainActivity render
        run: |
          set -e

          FILE="app/src/main/java/com/deutscha1/premium/MainActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          echo "Fixing MainActivity render..."

          perl -0pi -e 's/\bRunnable\s+render\s*=\s*\(\s*\)\s*->\s*\{/final Runnable[] render = new Runnable[1]; render[0] = () -> {/g' "$FILE"

          perl -0pi -e 's/render\.run\(\)/render[0].run()/g' "$FILE"

          echo "Checking render declaration:"
          grep -n "render" "$FILE"

      - name: Build Debug APK
        run: |
          gradle --init-script kotlin-fix.gradle clean assembleDebug --stacktrace

      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK successfully created:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-A1-Premium-Final-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7

      - name: Build completed
        run: |
          echo "======================================"
          echo " Deutsch A1 Premium APK BUILD SUCCESS "
          echo "======================================"
