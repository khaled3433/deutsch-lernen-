name: Deutsch A1 Premium - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          rm -rf AndroidProject
          mkdir -p AndroidProject
          unzip -q "$ZIP_FILE" -d AndroidProject

          echo "Extracted files:"
          find AndroidProject -maxdepth 4 -type f | head -100

      - name: Locate Android project
        run: |
          SETTINGS=$(find AndroidProject -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "Android project OK."

      - name: Check vocabulary
        run: |
          WORDS=$(find "$PROJECT_DIR/app/src/main" -type f -name "words.json" | head -n 1 || true)

          if [ -n "$WORDS" ]; then
            echo "Vocabulary found:"
            echo "$WORDS"
            echo "German entries:"
            grep -o '"german"' "$WORDS" | wc -l || true
          else
            echo "WARNING: words.json not found."
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-A1-Premium-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7

      - name: Build completed
        run: |
          echo "================================"
          echo "DEUTSCH A1 PREMIUM APK SUCCESS"
          echo "================================"
